name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'desktop/**'
      - 'firestore.rules'
      - '.github/workflows/windows.yml'
      - '.github/workflows/make-keystore.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check the logo files are in the repository
        run: |
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png logo.svg; do
            [ -f "$f" ] || { echo "::error::Missing $f. Copy your logo files from the IQRA VOCAB repository (see SETUP.md, step 1)."; exit 1; }
          done

      - name: Copy web files
        run: |
          mkdir www
          cp index.html config.js shell.js studio.js manifest.webmanifest logo.svg www/
          cp apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install and create Android project
        run: |
          npm install
          V=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/app@$V @capacitor/browser@$V @capacitor/filesystem@$V @capacitor/share@$V
          npx cap add android
          npx cap sync android

      - name: Apply name and logo
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          NAME="Quiz Studio"
          BG=$(convert icon-maskable-512.png -format '%[hex:p{4,4}]' info:)
          BG="#${BG:0:6}"
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$NAME</string>|; s|<string name=\"title_activity_main\">[^<]*</string>|<string name=\"title_activity_main\">$NAME</string>|" $RES/values/strings.xml
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read dn s f <<< "$d"
            M=$RES/mipmap-$dn
            h=$((s/2)); i=$((f*66/100))
            convert icon-512.png -resize ${s}x${s} "$M/ic_launcher.png"
            convert icon-512.png -resize ${s}x${s} \( -size ${s}x${s} xc:none -fill white -draw "circle $h,$h $h,0" \) -compose DstIn -composite "$M/ic_launcher_round.png"
            convert icon-maskable-512.png -resize ${i}x${i} -background none -gravity center -extent ${f}x${f} "$M/ic_launcher_foreground.png"
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">%s</color>\n</resources>\n' "$BG" > $RES/values/ic_launcher_background.xml
          for f in $(find $RES -name 'splash*.png'); do
            w=$(identify -format '%w' "$f"); hh=$(identify -format '%h' "$f")
            m=$((w<hh?w:hh)); l=$((m*28/100))
            convert -size ${w}x${hh} xc:"$BG" \( icon-512.png -resize ${l}x${l} \) -gravity center -composite "$f"
          done

      - name: App ID and return link (sign-in comes back to the app)
        run: |
          set -e
          sed -i 's/applicationId "[^"]*"/applicationId "com.iqra.quizstudio"/' android/app/build.gradle
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          f='''        <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="iqquizstudio" />
          </intent-filter>
          </activity>'''
          if 'android:scheme="iqquizstudio"' not in s:
              s=s.replace('</activity>',f,1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Add fixed signing key (if you made one)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret. The APK is signed with a temporary key, so each new build must be installed after removing the old app. See SETUP.md, step 6.1."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/quiz.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  quiz {
                      storeFile file('quiz.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.quiz
                  }
              }
          }
          GRADLE

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Quiz-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quiz-Studio-apk
          path: Quiz-Studio.apk

      - name: Publish to Release (permanent download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          if gh release view android-latest >/dev/null 2>&1; then
            gh release delete android-latest --cleanup-tag -y
          fi
          gh release create android-latest Quiz-Studio.apk \
            --title "Quiz Studio Android (latest)" \
            --notes "Latest Android APK. Build #${{ github.run_number }}, commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
