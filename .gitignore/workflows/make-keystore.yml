name: Make Android signing key (run ONCE)

# Creates the key that signs your APK, so every future build can be installed over the old one.
# IMPORTANT: use this only in a PRIVATE repository. The key is shown in the run summary.

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse in a public repository
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "This repository is PUBLIC. Make it private first (Settings > Danger zone > Change visibility), then run again."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create the key
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore quiz.keystore -alias quizstudio -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Quiz Studio, O=Quiz Studio, C=BD"
          {
            echo "## Save these 3 values as Secrets (Settings > Secrets and variables > Actions > New repository secret)"
            echo ""
            echo "**KEY_ALIAS**"
            echo '```'
            echo "quizstudio"
            echo '```'
            echo "**KEYSTORE_PASSWORD**"
            echo '```'
            echo "$PASS"
            echo '```'
            echo "**KEYSTORE_BASE64** (the long text below, copy all of it)"
            echo '```'
            base64 -w0 quiz.keystore
            echo ""
            echo '```'
            echo ""
            echo "Keep a private copy of these three values somewhere safe. If you lose them you can never update the installed app."
          } >> "$GITHUB_STEP_SUMMARY"
