name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'icon-512.png'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use your logo for the Windows app
        shell: bash
        run: |
          [ -f icon-512.png ] || { echo "::error::Missing icon-512.png. Copy your logo files from the IQRA VOCAB repository (see SETUP.md, step 1)."; exit 1; }
          mkdir -p desktop/build
          cp icon-512.png desktop/build/icon.png

      - name: Put your site address into the app
        shell: bash
        run: |
          URL=$(node -e "global.window={};require('./config.js');process.stdout.write(window.IQ_CONFIG.publicUrl)")
          echo "Site address: $URL"
          case "$URL" in *YOUR-SITE*) echo "::error::publicUrl in config.js is not set yet"; exit 1;; esac
          sed -i "s|^const SITE = .*|const SITE = '$URL';|" desktop/main.js

      - name: Build the Windows installer
        working-directory: desktop
        shell: bash
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Quiz-Studio-windows
          path: desktop/dist/*.exe

      - name: Publish to Release (permanent download link)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          cp desktop/dist/*.exe Quiz-Studio-Setup.exe
          if gh release view windows-latest >/dev/null 2>&1; then
            gh release delete windows-latest --cleanup-tag -y
          fi
          gh release create windows-latest Quiz-Studio-Setup.exe \
            --title "Quiz Studio for Windows (latest)" \
            --notes "Latest Windows installer. Build #${{ github.run_number }}, commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
