/* ======================= PART 1: shell (admin check + app sign-in bridge) ======================= */
/* shell.js - Quiz Studio helpers that studio.js expects from its host page:

(function(){var C=window.IQ_CONFIG||{},list=(C.admins||[]).map(function(x){return String(x).trim().toLowerCase();}).filter(Boolean);

(function(){'use strict';
if(window.IQAUTH)return;
var CFG=(window.IQ_CONFIG&&window.IQ_CONFIG.firebase)||{};
var BASE='https://www.gstatic.com/firebasejs/10.12.2/';
/* the address of the hosted web copy of this app (GitHub Pages), e.g. https://yourname.github.io/yourrepo/ */
var WEB_URL=String((window.IQ_CONFIG&&window.IQ_CONFIG.publicUrl)||'').replace(/\s+/g,'');if(/YOUR-SITE/i.test(WEB_URL))WEB_URL='';

function native(){try{return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());}catch(e){return false;}}

function plug(n){try{return(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n])||null;}catch(e){return null;}}
function err(c,m){var e=new Error(m||c);e.code=c;return e;}
function webUrl(){return WEB_URL||(native()?'':location.origin+location.pathname);}
function rnd(){var a=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(a);return Array.prototype.map.call(a,function(x){return('0'+x.toString(16)).slice(-2);}).join('');}
function el(tag,st,txt){var e=document.createElement(tag);if(st)e.setAttribute('style',st);if(txt!=null)e.textContent=txt;return e;}
var BTN='font:600 15px system-ui,sans-serif;padding:11px 18px;border-radius:12px;border:1px solid #c9d0e6;background:#fff;color:#16204a;cursor:pointer;margin:6px 6px 0 0';

  var c=el('div','background:#fff;color:#16204a;border-radius:18px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)');

/* ---- installed app: sign in with the phone's own browser, then pick the sign-in up here ---- */
function viaPlugin(au,auth,P){
  return P.signInWithGoogle({skipNativeAuth:true}).then(function(r){
    var c=(r&&r.credential)||{};if(!c.idToken&&!c.accessToken)throw err('iq/no-token','Google did not return a sign-in token.');
    return au.signInWithCredential(auth,au.GoogleAuthProvider.credential(c.idToken||null,c.accessToken||null));});}
function relay(au,auth){
  var base=webUrl();

  var code=rnd(),url=base+(base.indexOf('?')<0?'?':'&')+'iqlink='+code;

      function open(){var B=plug('Browser');try{if(B&&B.open){B.open({url:url});return;}}catch(e){}try{window.open(url,'_blank');}catch(e){}}
      ui.btn('Open browser again',open,true);

        busyP=true;
        fs.getDoc(ref).then(function(s){
          busyP=false;
          if(done)return;
          var d=s.exists()?(s.data()||{}):null;
          if(d&&d.idToken){
            busyP=true;fs.deleteDoc(ref).catch(function(){});
            var B=plug('Browser');try{if(B&&B.close)B.close();}catch(e){}

            return;}
          tm=setTimeout(poll,1200);

      };
      document.addEventListener('visibilitychange',wake);window.addEventListener('focus',wake);

  var P=plug('FirebaseAuthentication');

  var P=plug('FirebaseAuthentication');try{if(native()&&P&&P.signOut)P.signOut().catch(function(){});}catch(e){}
  return au.signOut(auth);}

    .catch(function(e){s.title('Could not sign in');s.text((e&&e.code==='permission-denied')?'The cloud rules do not allow this yet. The app owner must publish the authlink rule.':'Please try again ('+((e&&e.code)||'error')+').');});
  },true);
}
window.IQAUTH={signIn:signIn,signOut:signOut,native:native,embedded:embedded};

if(document.body)linkMode();else document.addEventListener('DOMContentLoaded',linkMode);
})();

<!-- FIRESTORE RULES (reference copy, never executed). This is the same text as firestore.rules in Firebase.
 If you change the rules in Firebase, paste the new text here too, so the next Claude chat knows how the app is protected. -->
<script type="text/plain" id="firestore-rules-reference">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // ---- who is an admin: lower-case Google e-mails. Keep it the same as "admins" in config.js ----
    function signed() { return request.auth != null && request.auth.token.email_verified == true; }
    function me() { return request.auth.token.email.lower(); }
    function isMaster() { return signed() && me() in ['zahidulislam1801@gmail.com','iqravocab@gmail.com']; }

    // ---- approved portal users (students / teachers registered in users/{uid}) ----
    function userPath() { return /databases/$(database)/documents/users/$(request.auth.uid); }
    function hasProfile() { return signed() && exists(userPath()); }
    function isApproved() { return hasProfile() && get(userPath()).data.status == 'approved'; }
    function isTeacher() { return isApproved() && get(userPath()).data.role == 'teacher'; }
    function headInst() { return get(userPath()).data.get('headOf', ''); }
    function isHead() { return isApproved() && headInst() != ''; }
    function isStaff() { return isMaster() || isTeacher(); }
    function photoOk() { return request.resource.data.get('photo', '').size() < 80000; }

    // ================= people =================
    match /users/{uid} {
      allow get: if signed() && (request.auth.uid == uid || isMaster()
                    || (isTeacher() && resource.data.role == 'student')
                    || (isHead() && resource.data.get('instId','') == headInst()));
      // teachers list students only (the app queries where role == 'student')
      allow list: if isMaster() || (isTeacher() && resource.data.role == 'student')
                    || (isHead() && resource.data.get('instId','') == headInst());

      // self-registration (gets a 5-digit roll from counters/roll) OR a head adding a student by hand
      allow create: if (signed() && request.auth.uid == uid
        && request.resource.data.uid == uid
        && request.resource.data.email == request.auth.token.email
        && request.resource.data.status == 'pending'
        && request.resource.data.role in ['student','teacher']
        && request.resource.data.get('roll','').matches('[0-9]{5}')
        && !('headOf' in request.resource.data)
        && photoOk())
        || (isHead() && request.resource.data.get('manual', false) == true
            && request.resource.data.role == 'student'
            && request.resource.data.status == 'approved'
            && request.resource.data.uid == uid
            && request.resource.data.get('instId','') == headInst()
            && photoOk());

      // a person can fix their own form only while it is pending / rejected; admin can change anything
      allow update: if isMaster()
        || (signed() && request.auth.uid == uid
            && resource.data.status != 'approved'
            && request.resource.data.uid == uid
            && request.resource.data.role == resource.data.role
            && request.resource.data.status == 'pending'
            && request.resource.data.get('roll','') == resource.data.get('roll','')
            && !('headOf' in request.resource.data)
            && photoOk())
        // the head of an institution: edits hand-made students, approves people of the same institution
        || (isHead() && resource.data.get('instId','') == headInst()
            && request.resource.data.get('instId','') == headInst()
            && request.resource.data.role == resource.data.role
            && request.resource.data.get('manual', false) == resource.data.get('manual', false)
            && (resource.data.get('manual', false) == true
                || request.resource.data.diff(resource.data).affectedKeys().hasOnly(['status','approvedAt','approvedBy','reason'])));
      allow delete: if isMaster()
        || (isHead() && resource.data.get('manual', false) == true && resource.data.get('instId','') == headInst());

      // personal messages (admin / teacher -> one person). The owner may only flip "read".
      match /inbox/{msgId} {
        allow read: if signed() && (request.auth.uid == uid || isMaster());
        allow create: if isStaff();
        allow update: if signed() && request.auth.uid == uid
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['read']);
        allow delete: if signed() && (request.auth.uid == uid || isMaster());
      }
    }

    // ================= institutions + monthly fees (head = teacher with headOf set by admin) =================
    match /institutions/{id} {
      allow read: if signed();
      allow write: if isMaster();
      allow update: if isHead() && headInst() == id
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['plan','nameEn','nameBn','address','addressEn','addressBn','phone','eiin','logo','updatedAt']);
    }
    // running number used to give every new person a unique 5-digit roll
    match /counters/{id} {
      allow read: if signed();
      allow create: if isMaster() || (signed() && id == 'roll' && request.resource.data.n == 10001);
      allow update: if isMaster() || (signed() && id == 'roll' && request.resource.data.n == resource.data.n + 1);
    }
    match /fees/{id} {
      allow read: if isMaster() || (signed() && resource.data.uid == request.auth.uid)
        || (isHead() && resource.data.instId == headInst());
      allow create: if isMaster() || (isHead() && request.resource.data.instId == headInst());
      allow update: if isMaster() || (isHead() && resource.data.instId == headInst()
        && request.resource.data.instId == headInst());
      allow delete: if isMaster();
    }

    // ================= classes, subjects, marking categories, institution name, pass mark =================
    match /settings/{id} {
      allow read: if signed();
      allow write: if isMaster();
    }

    // ================= exams and marks =================
    match /exams/{examId} {
      allow read: if isStaff();
      allow create: if isMaster() || (isTeacher() && request.resource.data.get('published', false) == false);
      // the exam structure (subjects, full marks) is locked for teachers once published
      allow update: if isMaster() || (isTeacher()
        && resource.data.get('published', false) == false
        && request.resource.data.get('published', false) == false);
      allow delete: if isMaster();

      // marks can be corrected by a teacher at any time (the app asks for a reason and logs it in /edits)
      match /marks/{studentUid} {
        allow read: if isStaff();
        allow create, update: if isStaff();
        allow delete: if isMaster();
      }

      // who entered each student's marks and when they were last edited: ONLY the master can read it
      match /audit/{studentUid} {
        allow read: if isMaster();
        allow create, update: if isStaff();
        allow delete: if isMaster();
      }

      // revision log: who changed which mark, from what to what, and why. Nobody can edit or erase it except the master.
      match /edits/{editId} {
        allow read: if isMaster();
        allow create: if isStaff();
        allow update: if false;
        allow delete: if isMaster();
      }
    }

    // ================= published combined results =================
    match /results/{examId} {
      allow read: if isMaster() || isApproved();
      allow create, delete: if isMaster();
      // after publishing, a teacher's mark correction re-writes the combined result
      allow update: if isMaster() || (isTeacher()
        && get(/databases/$(database)/documents/exams/$(examId)).data.get('published', false) == true);
    }

    // ================= notices: school-wide / class / role announcements =================
    match /notices/{id} {
      allow read: if isMaster() || isApproved();
      allow create: if isMaster() || (isTeacher()
        && request.resource.data.by.lower() == me()
        && (request.resource.data.aud == 'student' || request.resource.data.aud.matches('cls:.*')));
      allow update, delete: if isMaster() || (isTeacher() && resource.data.by.lower() == me());
    }

    // ================= student questions about results (answered by teachers) =================
    match /queries/{id} {
      allow create: if isApproved() && request.resource.data.uid == request.auth.uid
        && request.resource.data.status == 'open'
        && request.resource.data.text.size() <= 1000;
      allow read: if isStaff() || (signed() && resource.data.uid == request.auth.uid);
      allow update: if isStaff();
      allow delete: if isMaster();
    }

    // ================= EXISTING (teachers added) =================

    // quiz drafts
    match /quizzes/{id} {
      allow read, write: if isStaff();
    }

    // a published quiz link; anyone with the code can read it while it is on and not expired
    match /qlinks/{code} {
      allow list, create, update, delete: if isStaff();
      allow get: if isStaff()
        || (resource.data.on == true
            && (resource.data.exp == 0 || resource.data.exp > request.time.toMillis()));
    }

    // one submission per person per link
    match /qresp/{code}/r/{uid} {
      allow read: if isStaff() || (request.auth != null && request.auth.uid == uid);
      allow create: if request.auth != null && request.auth.uid == uid
        && get(/databases/$(database)/documents/qlinks/$(code)).data.on == true;
      allow update: if false;
      allow delete: if isStaff();
    }

    // certificate verification pages (?v=)
    match /qverify/{id} {
      allow get: if true;
      allow list: if false;
      allow create: if isStaff()
        || (request.auth != null
            && request.resource.data.uid == request.auth.uid
            && id == request.resource.data.code + '_' + request.auth.uid
            && request.resource.data.keys().hasOnly(['code','uid','name','title','score','total','pct','at','t'])
            && exists(/databases/$(database)/documents/qresp/$(request.resource.data.code)/r/$(request.auth.uid))
            && get(/databases/$(database)/documents/qresp/$(request.resource.data.code)/r/$(request.auth.uid)).data.score == request.resource.data.score
            && get(/databases/$(database)/documents/qresp/$(request.resource.data.code)/r/$(request.auth.uid)).data.total == request.resource.data.total);
      allow update: if isStaff();
      allow delete: if isStaff();
    }

    match /push_tokens/{uid} {
      allow read: if false;
      allow write: if request.auth != null && request.auth.uid == uid;
    }

    // sign-in hand-over for the Android / Windows apps (short-lived, one code per sign-in)
    match /authlink/{code} {
      allow get: if true;
      allow list: if false;
      allow create: if request.auth != null
        && request.resource.data.keys().hasOnly(['idToken','t'])
        && request.resource.data.idToken is string
        && request.resource.data.idToken.size() < 4000;
      allow delete: if true;
    }
  }
}
</script>
<script>
/* offline cache (normal websites only; the Android app already carries its own files) */
(function(){try{var C=window.Capacitor;if(C&&C.isNativePlatform&&C.isNativePlatform())return;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}}catch(e){}})();
</script>
